      tags: [Admin / Queries]
      summary: List AI queries
      description: |
        Returns anonymous AI queries from the last 90 days, newest first, so the
        admin can see what content is missing (UF-10). `query_text` is the
        redacted text (ADR 0007).
      operationId: adminListAiQueries
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: was_answered
          in: query
          description: Filter by whether the assistant found an answer in the content
          schema:
            type: boolean
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: AI queries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiQueryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
