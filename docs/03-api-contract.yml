  /admin/ai-queries/stats:
    get:
      tags: [Admin / Queries]
      summary: Count AI queries per matched life event (top topics)
      description: |
        Returns the number of AI queries per matched life event in the period,
        highest count first. Queries with no matched event are grouped under
        `life_event: null`. Without `from`/`to` the whole 90-day retention
        window is counted.
      operationId: adminAiQueryStats
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Counts per life event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiQueryStatsResponse'
              example:
                data:
                  - life_event:
                      id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                      slug: "selim-se"
                      title: "Selim se"
                    count: 42
                    unanswered_count: 5
                  - life_event: null
                    count: 17
                    unanswered_count: 17
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/stale-procedures:
    get:
      tags: [Admin / Queries]
      summary: List stale procedures
      description: |
        Returns procedures whose `last_verified_at` is older than 6 months or
        null. Never-verified procedures come first, then the oldest verification.
      operationId: adminListStaleProcedures
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Stale procedures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── ADMIN / AUDIT ──────────────────────────────────────────────────────────

  /admin/audit-log:
    get:
      tags: [Admin / Audit]
      summary: List audit log entries (read-only)
      description: |
        Returns audit entries, newest first. Entries are written only by database
        triggers; there is no endpoint to create, change or delete them, and RLS
        allows admins to read only ([ADR 0004](decisions/0004-admin-writes-with-user-jwt.md)).
      operationId: adminListAuditLog
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: entity_type
          in: query
          description: Table name of the changed entity
          schema:
            type: string
          example: procedures
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
        - name: changed_by
          in: query
          description: Admin user id
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  # ── SECURITY ───────────────────────────────────────────────────────────────

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase Auth access token. Admin endpoints also require the claim
        `app_metadata.role = 'admin'`; without it they return 403.
    SessionCookie:
      type: apiKey
      in: cookie
      name: sb-<project-ref>-auth-token
      description: |
        Supabase Auth session cookie set by `@supabase/ssr` when the admin signs
        in to the admin panel. The cookie name includes the Supabase project ref.
        Same admin claim rule as `BearerAuth`.

  # ── PARAMETERS ─────────────────────────────────────────────────────────────

  parameters:
    SlugPath:
      name: slug
      in: path
      required: true
      schema:
        type: string
      example: selim-se

    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      description: Number of results per page
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    Offset:
      name: offset
      in: query
      description: Number of results to skip
      schema:
        type: integer
        default: 0
        minimum: 0

    From:
      name: from
      in: query
      description: Only records created at or after this time (inclusive)
      schema:
        type: string
        format: date-time

    To:
      name: to
      in: query
      description: Only records created before this time (exclusive)
      schema:
        type: string
        format: date-time

    StatusFilter:
      name: status
      in: query
      description: Filter by status
      schema:
        $ref: '#/components/schemas/ContentStatus'

  # ── HEADERS ────────────────────────────────────────────────────────────────

  headers:
    RetryAfter:
      description: Seconds until the client may send another request
      schema:
        type: integer
        minimum: 1

  # ── SCHEMAS ────────────────────────────────────────────────────────────────

  schemas:

    # ── Base ──────────────────────────────────────────────────────────────────

    ContentStatus:
      type: string
      enum: [draft, published, archived]
      description: Content status. Only `published` is visible to the public.

    StatusChange:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ContentStatus'

    Money:
      type: string
      pattern: '^\d{1,8}\.\d{2}$'
      description: Amount in RSD as a decimal string with two decimals (database type NUMERIC(10,2)).
      example: "1250.00"

    CostType:
      type: string
      enum: [free, fixed, variable, unknown]
      description: |
        `free`: no cost. `fixed`: a known amount in `cost_amount`. `variable`:
        depends on the case, explained in `cost_description`. `unknown`: not
        known; the UI must not show it as free.

    InstitutionKind:
      type: string
      enum: [government, bank, employer, other]
      description: Kind of organization. The UI calls all of them organizations.

    Pagination:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          description: Total number of records
        limit:
          type: integer
        offset:
          type: integer

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Message to show to the user (Serbian, informal "ti")

    ValidationError:
      type: object
      required: [error, message, details]
      properties:
        error:
          type: string
          example: validation_error
        message:
          type: string
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    # ── Category ──────────────────────────────────────────────────────────────

    Category:
      type: object
      required: [id, name, slug, sort_order]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Lična dokumenta
        slug:
          type: string
          example: licna-dokumenta
        icon:
          type: string
          nullable: true
          description: Lucide icon name in kebab-case, rendered by the Osnova `Icon` component
          example: id-card
        sort_order:
          type: integer

    CategoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    CategoryWrite:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
        icon:
          type: string
          maxLength: 100
          nullable: true
        sort_order:
          type: integer
          default: 0

    # ── LifeEvent ─────────────────────────────────────────────────────────────

    LifeEventSummary:
      type: object
      required: [id, title, slug, category, procedure_count, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Selim se
        description:
          type: string
          nullable: true
        slug:
          type: string
          example: selim-se
        icon:
          type: string
          nullable: true
          description: Lucide icon name in kebab-case, rendered by the Osnova `Icon` component
          example: house
        estimated_duration:
          type: string
          nullable: true
          description: Total time for the whole event, entered by the admin (ADR 0008)
          example: "~2 nedelje"
        category:
          $ref: '#/components/schemas/Category'
        procedure_count:
          type: integer
          description: Number of procedures in this event (public responses count only public procedures)
        sort_order:
          type: integer
        status:
          $ref: '#/components/schemas/ContentStatus'

    LifeEventDetail:
      allOf:
        - $ref: '#/components/schemas/LifeEventSummary'
        - type: object
          required: [procedures, dependencies]
          properties:
            procedures:
              type: array
              description: Procedures in their defined order
              items:
                $ref: '#/components/schemas/ProcedureInEvent'
            dependencies:
              type: array
              description: Dependencies between procedures in this event
              items:
                $ref: '#/components/schemas/Dependency'

    ProcedureInEvent:
      type: object
      description: A procedure in the context of a life event
      required: [procedure_id, title, slug, sort_order, institutions, depends_on]
      properties:
        procedure_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        sort_order:
          type: integer
        can_online:
          type: boolean
        can_in_person:
          type: boolean
        can_by_mail:
          type: boolean
        cost_type:
          $ref: '#/components/schemas/CostType'
        cost_amount:
          type: string
          pattern: '^\d{1,8}\.\d{2}$'
          nullable: true
          description: Decimal string in RSD (see `Money`); set only when `cost_type` is `fixed`
        processing_time:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ContentStatus'
        is_stale:
          type: boolean
          description: True when `last_verified_at` is older than 6 months or null
        institutions:
          type: array
          description: Published institutions linked to this procedure
          items:
            $ref: '#/components/schemas/InstitutionRef'
        depends_on:
          type: array
          description: IDs of procedures in this event that must be done first
          items:
            type: string
            format: uuid

    LifeEventListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LifeEventSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    LifeEventWrite:
      type: object
      required: [title, slug, category_id, status]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        slug:
          type: string
          maxLength: 200
        category_id:
          type: string
          format: uuid
        icon:
          type: string
          maxLength: 100
          nullable: true
          description: Lucide icon name in kebab-case
        estimated_duration:
          type: string
          maxLength: 100
          nullable: true
          example: "~2 nedelje"
        status:
          $ref: '#/components/schemas/ContentStatus'
        sort_order:
          type: integer
          default: 0

    LifeEventProceduresWrite:
      type: object
      required: [procedures]
      properties:
        procedures:
          type: array
          items:
            type: object
            required: [procedure_id, sort_order]
            properties:
              procedure_id:
                type: string
                format: uuid
              sort_order:
                type: integer
                minimum: 0

    # ── Procedure ─────────────────────────────────────────────────────────────

    ProcedureRef:
      type: object
      required: [id, slug, title]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: prijava-prebivalista
        title:
          type: string
          example: Prijava prebivališta

    ProcedureSummary:
      type: object
      required: [id, title, slug, can_online, can_in_person, can_by_mail, cost_type, status, is_stale]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Prijava prebivališta
        slug:
          type: string
          example: prijava-prebivalista
        description:
          type: string
          nullable: true
        can_online:
          type: boolean
          description: The procedure can be done online
        can_in_person:
          type: boolean
          description: The procedure can be done in person
        can_by_mail:
          type: boolean
          description: The procedure can be done by mail
        cost_type:
          $ref: '#/components/schemas/CostType'
        cost_amount:
          type: string
          pattern: '^\d{1,8}\.\d{2}$'
          nullable: true
          description: Set only when `cost_type` is `fixed`
        processing_time:
          type: string
          nullable: true
          example: 7–15 radnih dana
        status:
          $ref: '#/components/schemas/ContentStatus'
        is_stale:
          type: boolean
          description: True when `last_verified_at` is older than 6 months or null
        last_verified_at:
          type: string
          format: date-time
          nullable: true

    ProcedureDetail:
      allOf:
        - $ref: '#/components/schemas/ProcedureSummary'
        - type: object
          required: [steps, documents, institutions, life_events]
          properties:
            cost_description:
              type: string
              nullable: true
            official_link:
              type: string
              format: uri
              nullable: true
            form_link:
              type: string
              format: uri
              nullable: true
            steps:
              type: array
              description: Ordered by `sort_order`
              items:
                $ref: '#/components/schemas/Step'
            documents:
              type: array
              description: Ordered by `sort_order`
              items:
                $ref: '#/components/schemas/Document'
            institutions:
              type: array
              description: Linked institutions; public responses include only published ones
              items:
                $ref: '#/components/schemas/ProcedureInstitution'
            life_events:
              type: array
              description: |
                Life events this procedure belongs to. Public responses include
                only published life events; admin responses include all.
              items:
                $ref: '#/components/schemas/LifeEventLink'

    ProcedureInstitution:
      allOf:
        - $ref: '#/components/schemas/InstitutionSummary'
        - type: object
          properties:
            note:
              type: string
              nullable: true
              description: Note on this procedure-institution link (`procedure_institutions.note`)
              example: Za online koristi eUprava portal, za lično idi u policijsku stanicu.

    LifeEventLink:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          example: selim-se
        title:
          type: string
          example: Selim se

    ProcedureListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ProcedureWrite:
      type: object
      required: [title, slug, status, cost_type, steps, institution_ids]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        slug:
          type: string
          maxLength: 200
        can_online:
          type: boolean
          default: false
        can_in_person:
          type: boolean
          default: true
        can_by_mail:
          type: boolean
          default: false
        cost_type:
          $ref: '#/components/schemas/CostType'
        cost_amount:
          type: string
          pattern: '^\d{1,8}\.\d{2}$'
          nullable: true
          description: Required when `cost_type` is `fixed`; must be null otherwise
        cost_description:
          type: string
          nullable: true
        processing_time:
          type: string
          maxLength: 200
          nullable: true
        official_link:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        form_link:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        status:
          $ref: '#/components/schemas/ContentStatus'
        last_verified_at:
          type: string
          format: date-time
          nullable: true
        steps:
          type: array
          minItems: 1
          description: At least one step (PR-01). Replaces the full list.
          items:
            $ref: '#/components/schemas/StepWrite'
        documents:
          type: array
          description: Documents of this procedure (ADR 0005). Replaces the full list.
          items:
            $ref: '#/components/schemas/DocumentWrite'
        institution_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: At least one institution (PR-02). Replaces the full list.
          items:
            type: string
            format: uuid
        institution_notes:
          type: object
          description: |
            Optional note per institution link, keyed by institution id. Keys
            must appear in `institution_ids` (422 otherwise).
          additionalProperties:
            type: string
            maxLength: 1000

    ProcedurePatch:
      type: object
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/ContentStatus'
        last_verified_at:
          type: string
          format: date-time

    # ── Step ──────────────────────────────────────────────────────────────────

    Step:
      type: object
      required: [id, sort_order, title, description]
      properties:
        id:
          type: string
          format: uuid
        sort_order:
          type: integer
        title:
          type: string
        description:
          type: string
        link_url:
          type: string
          format: uri
          nullable: true
        link_label:
          type: string
          nullable: true

    StepWrite:
      type: object
      required: [title, description, sort_order]
      properties:
        title:
          type: string
          maxLength: 300
        description:
          type: string
        sort_order:
          type: integer
        link_url:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        link_label:
          type: string
          maxLength: 200
          nullable: true

    # ── Document ──────────────────────────────────────────────────────────────

    Document:
      type: object
      description: A document the citizen prepares for this procedure. Owned by one procedure (ADR 0005).
      required: [id, name, is_required, sort_order]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        is_required:
          type: boolean
        note:
          type: string
          nullable: true
        sort_order:
          type: integer

    DocumentWrite:
      type: object
      required: [name, is_required, sort_order]
      properties:
        name:
          type: string
          maxLength: 300
        description:
          type: string
          nullable: true
        is_required:
          type: boolean
        note:
          type: string
          nullable: true
        sort_order:
          type: integer

    # ── Institution ───────────────────────────────────────────────────────────

    InstitutionRef:
      type: object
      required: [name, slug, kind]
      properties:
        name:
          type: string
          example: Ministarstvo unutrašnjih poslova (MUP)
        slug:
          type: string
          example: mup
        kind:
          $ref: '#/components/schemas/InstitutionKind'

    InstitutionSummary:
      type: object
      required: [id, name, slug, kind, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ministarstvo unutrašnjih poslova (MUP)
        slug:
          type: string
          example: mup
        kind:
          $ref: '#/components/schemas/InstitutionKind'
        address:
          type: string
          nullable: true
          description: Address of the head office. Branch offices are not modelled in v1 (ADR 0008).
          example: Kneza Miloša 101, Beograd
        website:
          type: string
          format: uri
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        working_hours:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ContentStatus'

    Institution:
      allOf:
        - $ref: '#/components/schemas/InstitutionSummary'
        - type: object
          properties:
            description:
              type: string
              nullable: true

    InstitutionDetail:
      allOf:
        - $ref: '#/components/schemas/Institution'
        - type: object
          required: [procedures]
          properties:
            procedures:
              type: array
              items:
                $ref: '#/components/schemas/ProcedureSummary'

    InstitutionListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    InstitutionWrite:
      type: object
      required: [name, slug, kind, status]
      properties:
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/InstitutionKind'
        description:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        phone:
          type: string
          maxLength: 50
          nullable: true
        email:
          type: string
          format: email
          maxLength: 200
          nullable: true
        working_hours:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ContentStatus'

    # ── Dependency ────────────────────────────────────────────────────────────

    Dependency:
      type: object
      description: "`procedure_id` cannot start until `depends_on_id` is done, within `life_event_id`."
      required: [life_event_id, procedure_id, depends_on_id]
      properties:
        life_event_id:
          type: string
          format: uuid
        procedure_id:
          type: string
          format: uuid
        depends_on_id:
          type: string
          format: uuid

    DependencyWrite:
      type: object
      required: [procedure_id, depends_on_id]
      properties:
        procedure_id:
          type: string
          format: uuid
          description: The procedure that depends on the other one
        depends_on_id:
          type: string
          format: uuid
          description: The procedure that must be done first

    DependencyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'

    # ── Synonym ───────────────────────────────────────────────────────────────

    Synonym:
      type: object
      required: [id, term, maps_to, created_at]
      properties:
        id:
          type: string
          format: uuid
        term:
          type: string
          description: Informal term people type
          example: karton
        maps_to:
          type: string
          description: Standard term it maps to
          example: izvod iz matične knjige
        created_at:
          type: string
          format: date-time

    SynonymWrite:
      type: object
      required: [term, maps_to]
      properties:
        term:
          type: string
          minLength: 2
          maxLength: 200
        maps_to:
          type: string
          minLength: 2
          maxLength: 200

    SynonymListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Synonym'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ── Search ────────────────────────────────────────────────────────────────

    SearchResponse:
      type: object
      required: [query, original_query, life_events, procedures, institutions, total_count]
      properties:
        query:
          type: string
          description: The term that was searched (a mapped synonym when one applied)
        original_query:
          type: string
          description: What the user typed, before synonym mapping
        life_events:
          type: array
          items:
            $ref: '#/components/schemas/LifeEventSummary'
        procedures:
          type: array
          items:
            $ref: '#/components/schemas/ProcedureSummary'
        institutions:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionSummary'
        total_count:
          type: integer
          description: Total number of results

    # ── AI ────────────────────────────────────────────────────────────────────

    AiChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 1000

    AiChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            The whole conversation, oldest first, held by the client. Roles
            alternate and the last message has `role: user` (422 otherwise). The
            last user message must be at least 3 characters.
          items:
            $ref: '#/components/schemas/AiChatMessage'

    AiRedactionKind:
      type: string
      enum: [jmbg, phone, email, document_number]

    AiChatResponse:
      type: object
      required: [answer, was_answered, matched_life_event, procedures, redaction]
      properties:
        answer:
          type: string
          description: The assistant's answer, in Serbian (Latin script, informal "ti")
        was_answered:
          type: boolean
          description: Whether the answer came from the content, taken from structured output (ADR 0006)
        matched_life_event:
          type: object
          nullable: true
          required: [id, slug, title]
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            title:
              type: string
          description: The life event the model picked, if any; link with `/dogadjaj/{slug}`
        procedures:
          type: array
          description: |
            Published procedures the model picked and the answer is based on, in
            the order the model ranked them; link with `/procedura/{slug}`. Empty
            when `was_answered` is false. IDs the model returns that are not
            public are dropped by the server.
          items:
            $ref: '#/components/schemas/ProcedureRef'
        redaction:
          $ref: '#/components/schemas/AiRedaction'

    AiRedaction:
      type: object
      description: |
        Whether personal data was masked in the user's messages before they were
        sent to the model and stored (ADR 0007). When `applied` is true, the UI
        tells the user, for example "Uklonili smo lične podatke iz tvoje poruke
        pre slanja." Redaction is best effort.
      required: [applied, kinds]
      properties:
        applied:
          type: boolean
        kinds:
          type: array
          description: Kinds of data that were masked; values only, never the masked text
          items:
            $ref: '#/components/schemas/AiRedactionKind'

    # ── AI Queries ────────────────────────────────────────────────────────────

    AiQuery:
      type: object
      required: [id, query_text, was_answered, created_at]
      properties:
        id:
          type: string
          format: uuid
        query_text:
          type: string
          description: The last user message, after redaction (ADR 0007). Deleted after 90 days.
        was_answered:
          type: boolean
        matched_event_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    AiQueryStatsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [life_event, count, unanswered_count]
            properties:
              life_event:
                type: object
                nullable: true
                description: The matched life event, or null for queries with no match
                required: [id, slug, title]
                properties:
                  id:
                    type: string
                    format: uuid
                  slug:
                    type: string
                  title:
                    type: string
              count:
                type: integer
                minimum: 0
              unanswered_count:
                type: integer
                minimum: 0
                description: Queries in this group with `was_answered = false`

    AiQueryListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AiQuery'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ── Audit log ─────────────────────────────────────────────────────────────

    AuditAction:
      type: string
      enum: [create, update, archive, delete]
      description: "`delete` is used only for steps, documents, link rows and synonyms; content entities are archived."

    AuditLogEntry:
      type: object
      required: [id, entity_type, entity_id, action, changed_by, changed_at]
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
          description: Table name of the changed entity
          example: procedures
        entity_id:
          type: string
          description: |
            UUID of the changed row. For link rows without their own id
            (life event procedures, dependencies) the trigger records the
            life event id.
          format: uuid
        action:
          $ref: '#/components/schemas/AuditAction'
        changed_by:
          type: string
          format: uuid
          description: Admin user id (`auth.uid()` at the time of the change)
        changed_at:
          type: string
          format: date-time
        diff:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Old and new values of changed fields: `{"field": {"old": ..., "new": ...}}`'

    AuditLogListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

  # ── RESPONSES ─────────────────────────────────────────────────────────────

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: "Unesi bar 2 karaktera za pretragu."

    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized
            message: "Prijavi se da nastaviš."

    Forbidden:
      description: Authenticated, but the token lacks `app_metadata.role = 'admin'`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden
            message: "Nemaš pristup ovoj akciji."

    NotFound:
      description: Resource not found (or not public)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: "Nismo pronašli ono što tražiš."

    Conflict:
      description: A unique value (slug, name, term) is already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: conflict
            message: "Ovaj slug je već zauzet."

    ValidationError:
      description: Request is well-formed but breaks a business rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            error: validation_error
            message: "Proveri označena polja."
            details:
              - field: steps
                message: "Procedura mora imati najmanje jedan korak."
              - field: institution_ids
                message: "Poveži bar jednu organizaciju."

    TooManyRequests:
      description: |
        AI rate limit reached: 10 requests per hashed IP per clock hour.
        `Retry-After` gives the seconds until the current hourly window ends (fixed windows in `ai_rate_limits`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                required: [retry_after_seconds]
                properties:
                  retry_after_seconds:
                    type: integer
                    minimum: 1
          example:
            error: rate_limited
            message: "Iskoristio si 10 pitanja za ovaj sat. Pokušaj ponovo za 25 minuta."
            retry_after_seconds: 1500

    AiUnavailable:
      description: The assistant is temporarily unavailable (monthly spending limit reached or Anthropic API unreachable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: ai_unavailable
            message: "Asistent trenutno nije dostupan. Pokušaj ponovo kasnije ili pronađi svoj životni događaj na početnoj strani."

    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: "Došlo je do greške. Pokušaj ponovo."
